<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>词造武器 · 白噪纪</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --panel2:#1b222d; --line:#26303d;
    --ink:#e2e8f0; --dim:#8a97a8; --faint:#5a6674;
    --hp:#d16060; --tok:#d9b45c; --acc:#6fb3d9; --good:#5fb08a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none}
  input{font-family:inherit;font-size:inherit}

  #app{height:100%;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;padding:10px 12px}

  .hud{display:flex;gap:8px;align-items:center;padding:4px 2px 9px;flex-wrap:wrap}
  .pill{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:5px;
        background:var(--panel);border:1px solid var(--line);white-space:nowrap}
  .pill b{font-weight:600}
  .hp b{color:var(--hp)} .tok b{color:var(--tok)} .wv b{color:var(--acc)}
  .spacer{flex:1}
  .wpn{font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:5px;
       border:1px solid currentColor;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
  .mode{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:4px;
        border:1px solid currentColor;color:var(--faint);background:transparent}
  .mode.llm{color:var(--good)}

  .stage{position:relative;flex:1;min-height:0;border:1px solid var(--line);
         border-radius:9px;overflow:hidden;background:#080b10}
  canvas{display:block;width:100%;height:100%}

  .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
          flex-direction:column;gap:13px;background:rgba(8,11,16,.92);padding:24px;text-align:center;overflow-y:auto}
  .center.hide{display:none}
  .center h2{margin:0;font-size:22px;letter-spacing:.1em}
  .center p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.85;max-width:460px}
  .center .k{color:var(--ink);font-weight:600}
  .big{background:var(--acc);color:#0b0e13;font-weight:700;padding:12px 30px;
       border-radius:7px;font-size:15px}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
         padding:9px 14px;border-radius:6px;font-size:13px}
  .ghost:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
  .meta{font-family:var(--mono);font-size:11.5px;color:var(--faint);line-height:1.8}
  .keys{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .keys b{color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 5px}

  .list{width:100%;max-width:440px;max-height:32vh;overflow-y:auto;text-align:left;
        background:var(--panel);border-radius:8px;padding:9px 12px}
  .row{display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:12px;
       padding:5px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .w{flex:1;font-family:var(--sans);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .s{color:var(--acc)} .row .c{color:var(--tok)}

  .forge{padding:10px 2px 3px;display:flex;gap:8px;align-items:center}
  .forge input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:11px 13px;outline:none;min-width:0;transition:.15s}
  .forge input:focus{border-color:var(--acc);background:var(--panel2)}
  .cost{font-family:var(--mono);font-size:12px;color:var(--tok);white-space:nowrap;min-width:54px;text-align:right}
  .cost.no{color:var(--hp)}
  .mk{background:var(--tok);color:#0b0e13;font-weight:700;padding:11px 16px;border-radius:7px;white-space:nowrap}
  .mk:disabled{opacity:.35;cursor:not-allowed}
  .tips{padding:3px 2px 0;font-family:var(--mono);font-size:11px;color:var(--faint);
        display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:24px}
  .tips button{background:transparent;border:1px dashed var(--line);color:var(--dim);
               padding:3px 9px;border-radius:20px;font-size:11.5px}
  .tips button:hover{border-style:solid;border-color:var(--acc);color:var(--acc)}
  .tips .cached{border-color:var(--good);color:var(--good);border-style:solid}

  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;
         padding:18px;width:100%;max-width:410px;text-align:left}
  .sheet label{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);
               letter-spacing:.08em;margin:11px 0 4px;text-transform:uppercase}
  .sheet input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
               border-radius:6px;padding:8px 10px;outline:none}
  .presets{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .presets button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
                  padding:3px 8px;border-radius:4px;font-size:11px;font-family:var(--mono)}
  .sheet .big{width:100%;margin-top:16px;padding:11px}

  .flash{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--mono);
         font-size:13px;padding:7px 15px;border-radius:6px;background:rgba(20,25,34,.94);
         border:1px solid var(--line);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5}
  .flash.on{opacity:1}
</style>
</head>

  const images = {};
  function load(){
    return Promise.all(Object.keys(DATA).map(name => new Promise((ok, no) => {
      const im = new Image();
      im.onload = () => { images[name] = im; ok(); };
      im.onerror = () => no(new Error('art load fail: ' + name));
      im.src = DATA[name];
    }))).then(() => true);
  }
  function draw(ctx, sheet, frame, x, bottomY, flipX, alpha){
    const im = images[sheet], f = atlas[sheet] && atlas[sheet][frame];
    if (!im || !f) return false;
    const [sx,sy,sw,sh] = f.src, [dw,dh] = f.draw;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.imageSmoothingEnabled = false;
    ctx.translate(Math.round(x), Math.round(bottomY));
    if (flipX) ctx.scale(-1, 1);
    ctx.drawImage(im, sx, sy, sw, sh, -dw/2, -dh, dw, dh);
    ctx.restore();
    return true;
  }
  function drawTiled(ctx, sheet, frame, x, bottomY, width){
    const f = atlas[sheet] && atlas[sheet][frame];
    if (!f || !images[sheet]) return false;
    const tw = f.draw[0];
    for (let px = x; px < x + width; px += tw)
      draw(ctx, sheet, frame, px + tw/2, bottomY);
    return true;
  }
  return { atlas, images, load, draw, drawTiled };

/* ---------------- 武器构建（与判定解耦：LLM 只选类型，数值归代码） ---------------- */
function buildWeapon(word, judged, cost){
  const n = [...word.trim()].length || 1;
  const r = Math.max(5, 45 - 3*n);              // 字数买可控性
  let S = 100 + rnd(-0.6*r, r);
  if (judged.overload) S *= 1.35;
  S = clamp(Math.round(S), S_MIN, S_MAX);

  const eff = [];
  let budget = S, dropped = 0;
  for (const e of (judged.requested_effects||[])){
    if (!FX[e] || eff.includes(e)) continue;
    if (eff.length >= MAX_FX){ dropped++; continue; }
    eff.push(e); budget -= FX[e].cost;
  }
  for (const e of (judged.flavor_effects||[])){
    if (!FX[e] || eff.includes(e) || eff.length >= MAX_FX) continue;
    if (budget - FX[e].cost < 55) continue;
    eff.push(e); budget -= FX[e].cost;
  }

  const t = ARCH[judged.archetype] || ARCH.balanced;
  const k = clamp(budget, 30, 999) / 100;
  const b = CFG.baseStat;
  return {
    word, name: judged.name || word,
    strength:S, power:Math.round(budget), dropped,
    arch: judged.archetype || 'balanced', archLabel: t.label,
    color: judged.color || '#9fb4c8',
    effects: eff, overload: !!judged.overload,
    damage: b.damage * t.damage * k,
    fireRate: b.fireRate * t.fireRate * (0.6 + 0.4*k),
    bulletSpeed: b.bulletSpeed * t.speed,
    pierce: t.pierce + (budget > 130 ? 1 : 0),
    count: t.count + (t.count>1 && budget > 130 ? 1 : 0),
    size: t.size, cost, reason: judged.reason || '',
  };
}
function makeStone(){
  const w = buildWeapon(CFG.stone.name, { archetype:'balanced', requested_effects:[], flavor_effects:[],
           color:CFG.stone.color, name:'石头', reason:'免费保底' }, 0);
  w.strength = w.power = CFG.stone.strength;
  w.damage = CFG.baseStat.damage;
  w.fireRate = 2.4;
  return w;
}

/* ---------------- 《旧典》：离线词表判定 ---------------- */
function ruleJudge(word){
  const w = word.trim();
  const overload = OVERLOAD_WORDS.some(x => w.includes(x));
  let hit = null;
  for (const e of LEX) if (e.k.some(x => w.includes(x))) { hit = e; break; }

  const req = [];
  if (/追踪|追|制导|寻的|跟踪/.test(w)) req.push('homing');
  if (/减速|冻|粘|缠|迟缓/.test(w))     req.push('slow');
  if (/爆炸|炸|爆|轰/.test(w))          req.push('explode');
  if (/分裂|裂开|碎裂|散开/.test(w))    req.push('split');
  if (/弹射|反弹|跳弹|回旋/.test(w))    req.push('bounce');

  if (hit){
    return { archetype:hit.arch, requested_effects:req, flavor_effects:hit.fx,
             color:hit.c, overload, name:w,
             reason:`《旧典》· 查到「${hit.k[0]}」字条目 → ${ARCH[hit.arch].label}型` };
  }
  let h = 0; for (const ch of w) h = (h*31 + ch.codePointAt(0)) >>> 0;
  const ks = Object.keys(ARCH);
  return { archetype:ks[h % ks.length], requested_effects:req, flavor_effects:[],
           color:`hsl(${h%360} 45% 62%)`, overload, name:w,
           reason:'《旧典》查无此词，按字形硬铸——它并不理解这个词' };
}

/* ---------------- 一字师：模型判定 ---------------- */
const SYS = `你是一个游戏里的「武器锻造判定器」。玩家输入一个词或一句描述，你判断它应该变成什么味道的枪。
你不决定具体数值，只决定类型、特效和颜色。数值由游戏代码按预算分配。

archetype 四选一：
- pierce   穿透型：高弹速、高穿透、单发（针、锥、激光、狙击、光束）
- barrage  弹幕型：多弹丸、高射速、低单发伤害（散弹、虫群、雨、碎片）
- heavy    重击型：超高单发伤害、低射速（锤、陨石、炮、黑洞）
- balanced 均衡型：都不突出

特效只能从这五个里选：homing(追踪) slow(减速) explode(爆炸) split(分裂) bounce(弹射)

严格区分两类特效：
- requested_effects：玩家在输入里**明确写出来**的（写了"追踪"才算），一定会实装
- flavor_effects：你根据词义**自己联想**的，预算不够会被裁掉

overload：仅当玩家试图用"无敌/秒杀/无限/最强"这类词直接索取胜利时为 true。

只输出 JSON，不要围栏不要解释：
{"archetype":"pierce","requested_effects":[],"flavor_effects":["slow"],"color":"#7db8d9","overload":false,"name":"冰锥","reason":"一句话说明你怎么理解这个词"}`;

function parseLoose(raw){
  if (!raw) return null;
  let t = String(raw).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a<0 || b<0) return null;
  try { return JSON.parse(t.slice(a,b+1)); } catch { return null; }
}
function validate(v){
  if (!v || typeof v!=='object') return '非对象';
  if (!ARCH[v.archetype]) return 'archetype 非法';
  const ok = a => !a || (Array.isArray(a) && a.every(x=>FX[x]));
  if (!ok(v.requested_effects)) return 'requested_effects 非法';
  if (!ok(v.flavor_effects)) return 'flavor_effects 非法';
  if (v.color && !/^#[0-9a-f]{6}$/i.test(v.color)) v.color = null;
  return null;
}
async function llmJudge(word){
  const msgs = [{role:'system',content:SYS},{role:'user',content:word}];
  let err = null;
  for (let i=0;i<2;i++){
    const t0 = performance.now();
    try{
      const body = { model:cfgLLM.model, temperature:0.7, max_tokens:180,
                     messages: i===0 ? msgs : msgs.concat([{role:'user',content:`上次输出不合法（${err}），只输出合法 JSON。`}]) };
      const res = await fetch(cfgLLM.url.replace(/\/+$/,'')+'/chat/completions',{
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfgLLM.key},
        body: JSON.stringify(body) });
      const ms = Math.round(performance.now()-t0);
      if (!res.ok){ err = 'HTTP '+res.status; continue; }
      const d = await res.json();
      const v = parseLoose(d?.choices?.[0]?.message?.content);
      const e = validate(v);
      if (e){ err = e; continue; }
      v.reason = '一字师 · ' + (v.reason||'');
      return { v, ms, usage:d.usage||null, attempts:i+1 };
    }catch(ex){ err = String(ex.message||ex); }
  }
  return { v:null, error:err, attempts:2 };
}

/* ---------------- 实体 ---------------- */
function spawnAt(mId, x, y){
  const d = MONSTERS[mId];
  const L = LEVELS[G.level];
  const gy = (y!=null ? y : VH-GROUND_H) - d.h/2;    // y 传站台面，落成中心
  // 走地怪绑定自己的站台：巡逻/冲锋不越出站台边缘
  let minX = 20, maxX = L.width-20;
  if (!d.fly && y!=null){
    for (const p of L.plats){
      if (Math.abs(p[1]-y) < 2 && x >= p[0]-6 && x <= p[0]+p[2]+6){
        minX = p[0]+d.w/2; maxX = p[0]+p[2]-d.w/2; break;
      }
    }
  }
  return { mId, name:d.name, behavior:d.behavior, shape:d.shape, color:d.color,
           x, y: d.fly ? (y!=null? y : VH-GROUND_H-120) : gy,
           hp:d.hp, max:d.hp, dmg:d.dmg, w:d.w, h:d.h, sp:d.sp,
           fly:!!d.fly, armor:d.armor||0, splits:!!d.splits, spawns:d.spawns,
           minX, maxX, face:-1, slow:0, ct:rnd(0.5,2), st:'patrol', stT:0,
           ang:rnd(0,Math.PI*2), homeX:x, phase0:rnd(0,6.28), touchT:0 };
}
function spawnBoss(){
  const e = { isBoss:true, name:BOSS.name, behavior:'boss', shape:BOSS.shape, color:BOSS.color,
              x:LEVELS[G.level].width-320, y:200, w:BOSS.w, h:BOSS.h,

              exposedT:0, phase:1, shredded:false, st:'hover', stT:6, touchT:0, phase0:0 };

}

/* ---------------- 平台 ---------------- */
function platsOf(){ return LEVELS[G.level].plats; }
/* 单向站台着地检测：从上往下穿过站台面时落住。
   两处宽容（都是真人跑测逼出来的，见 decisions.md #16）：
   - 横向 ±10 = 碰撞盒半宽。原来用中心点 ±4，精灵视觉 46px 宽，
     玩家看着已经站上台沿、中心还没进范围，就是不落。
   - prevFoot 容差 16px（台沿宽容带）：斜向入台时，垂直穿越比横向进入
     早 1-2 帧，穿越帧错过就永远落不上。脚底略低于台面且在下落，吸附上台。 */
function landY(x, prevFoot, foot){
  if (foot >= VH-GROUND_H && prevFoot <= VH-GROUND_H+1) return VH-GROUND_H;
  for (const p of platsOf()){
    if (x >= p[0]-10 && x <= p[0]+p[2]+10 && prevFoot <= p[1]+16 && foot >= p[1]) return p[1];
  }
  return null;
}

/* ---------------- 主循环 ---------------- */
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(0.04, (t-lastT)/1000 || 0); lastT = t;
  if (!G) return;
  if (running && !G.over) step(dt);
  draw();
}
requestAnimationFrame(loop);

function step(dt){
  const P = CFG.player, L = LEVELS[G.level];

  /* ---- 玩家 ---- */
  let mv = 0;
  if (keys.ArrowLeft || keys.KeyA) mv -= 1;
  if (keys.ArrowRight || keys.KeyD) mv += 1;
  G.vx = mv * P.speed;
  if (mv) G.face = mv;
  else if (G.alive.length){
    // 站定时自动面向最近的敌人：让「撤—停—打」成立，不然后撤永远背对追兵
    let t=null, bd=1e9;
    for (const e of G.alive){ const d=(e.x-G.px)**2+(e.y-G.py)**2; if(d<bd){bd=d;t=e;} }
    if (t) G.face = Math.sign(t.x-G.px) || G.face;
  }
  const prevFoot = G.py + P.h/2;
  G.vy += P.gravity*dt;
  G.px = clamp(G.px + G.vx*dt, 14, L.width-14);
  G.py += G.vy*dt;
  const foot = G.py + P.h/2;
  if (G.vy >= 0){
    const ly = landY(G.px, prevFoot, foot);
    if (ly != null){ G.py = ly - P.h/2; G.vy = 0; G.onGround = true; G.jumpsLeft = P.jumps; }
    else G.onGround = false;
  } else G.onGround = false;
  if (G.invulnT > 0) G.invulnT -= dt;
  G.cam = clamp(G.px - VW/2, 0, L.width - VW);

  /* ---- 开火：朝面向，自动 ---- */
  G.cd -= dt;
  if (G.cd <= 0 && G.alive.length){
    fire();
    G.cd = 1/Math.max(0.25, G.weapon.fireRate);
  }

  /* ---- 玩家子弹 ---- */
  const w = G.weapon;
  for (let i=G.bullets.length-1;i>=0;i--){
    const b = G.bullets[i];
    if (w.effects.includes('homing')){
      let best=null, bd=1e9;
      for (const e of G.alive){ const d=(e.x-b.x)**2+(e.y-b.y)**2; if(d<bd && !b.hit.includes(e)){bd=d;best=e;} }
      if (best){
        const a = Math.atan2(best.y-b.y, best.x-b.x), s = Math.hypot(b.vx,b.vy);
        b.vx += (Math.cos(a)*s - b.vx)*Math.min(1, 5*dt);
        b.vy += (Math.sin(a)*s - b.vy)*Math.min(1, 5*dt);
      }
    }
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    let out = b.x<G.cam-40 || b.x>G.cam+VW+40 || b.y<-30 || b.y>VH+10;
    if (w.effects.includes('bounce') && b.gen<2){
      if (b.y > VH-GROUND_H){ b.y=VH-GROUND_H; b.vy=-Math.abs(b.vy); b.gen++; out=false; }
      if (b.x<14 || b.x>L.width-14){ b.vx*=-1; b.gen++; out=false; }
    }
    if (out || b.life<=0){ G.bullets.splice(i,1); continue; }

    for (let j=G.alive.length-1;j>=0;j--){
      const e = G.alive[j];
      if (b.hit.includes(e)) continue;
      if (Math.abs(e.x-b.x) < e.w/2+b.r && Math.abs(e.y-b.y) < e.h/2+b.r){
        // 杠头正面免伤：子弹从它面朝的方向来 → 吃护甲；绕背后 → 全伤
        let armor = e.armor;
        if (armor && !e.isBoss && Math.sign(b.vx) === -e.face) armor = 0;
        const dmg = Math.max(1, b.dmg - armor);
        e.hp -= dmg; b.hit.push(e);
        boom(b.x, b.y, w.color, 3, 60);
        if (w.effects.includes('slow')) e.slow = 1.4;
        if (w.effects.includes('explode')){
          boom(b.x,b.y,w.color,10,150);
          for (const o of G.alive)
            if (o!==e && (o.x-b.x)**2+(o.y-b.y)**2 < 55**2) o.hp -= dmg*0.55;
        }
        if (w.effects.includes('split') && b.gen<1){
          for (let s2=0;s2<2;s2++){
            const a = Math.atan2(b.vy,b.vx) + (s2?0.55:-0.55);
            const sp = Math.hypot(b.vx,b.vy)*0.8;
            G.bullets.push({ x:b.x, y:b.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
                             dmg:b.dmg*0.5, pierce:0, r:b.r*0.7, hit:[e], life:1.1, gen:1 });
          }
        }
        if (e.hp <= 0) killEnemy(e, j);
        if (b.hit.length > b.pierce){ G.bullets.splice(i,1); break; }
      }
    }
  }

  /* ---- 敌人 ---- */
  for (let i=G.alive.length-1;i>=0;i--){
    const e = G.alive[i];
    if (e.slow>0) e.slow -= dt;
    if (e.touchT>0) e.touchT -= dt;
    const sp = e.sp * (e.slow>0 ? 0.42 : 1);
    const dx = G.px - e.x, dy = G.py - e.y;

    if (e.behavior==='walker'){
      // 巡逻；玩家在同高度带且不远时追
      const near = Math.abs(dx) < 320 && Math.abs(dy) < 90;
      if (e.armor){
        // 杠头转身慢：跳到它背后有 1.3s 的输出窗口——它从不回头看自己说过什么
        e.turnT = (e.turnT||0) - dt;
        if (near && e.turnT<=0 && Math.sign(dx)!==e.face){ e.face = Math.sign(dx)||e.face; e.turnT = 1.3; }
      }
      else if (near) e.face = Math.sign(dx) || e.face;
      else if (Math.abs(e.x - e.homeX) > 130) e.face = Math.sign(e.homeX - e.x);
      e.x = clamp(e.x + e.face * sp * (near?1:0.55) * dt, e.minX, e.maxX);
      if (e.x === e.minX || e.x === e.maxX) e.face *= (near ? 1 : -1) || 1;  // 巡逻到边缘折返

    } else if (e.behavior==='floater'){
      const a = Math.atan2(dy, dx);
      e.x += Math.cos(a)*sp*dt; e.y += Math.sin(a)*sp*dt;
      e.y += Math.sin(performance.now()/500 + e.phase0)*12*dt;
      e.y = clamp(e.y, 30, VH-GROUND_H-e.h/2);

    } else if (e.behavior==='bat'){
      const a = Math.atan2(dy, dx);
      e.x += Math.cos(a)*sp*dt;
      e.y += Math.sin(a)*sp*0.8*dt + Math.sin(performance.now()/240 + e.phase0)*46*dt;
      e.y = clamp(e.y, 24, VH-GROUND_H-e.h/2);
      e.face = Math.sign(dx)||e.face;

    } else if (e.behavior==='sniper'){
      e.face = Math.sign(dx) || e.face;
      if (Math.abs(dx) < 170) e.x -= Math.sign(dx)*sp*dt;          // 保持距离
      else if (Math.abs(dx) > 460) e.x += Math.sign(dx)*sp*0.5*dt;
      e.x = clamp(e.x, e.minX, e.maxX);
      e.ct -= dt;
      if (e.ct<=0 && Math.abs(dx)<560 && Math.abs(dy)<120){
        e.ct = 2.1;
        G.eb.push({ x:e.x, y:e.y-6, vx:Math.sign(dx)*250, vy:0, r:4, dmg:e.dmg, life:2.6 });
      }

    } else if (e.behavior==='charger'){
      e.stT -= dt;
      if (e.st==='patrol'){
        e.face = Math.sign(dx)||e.face;
        e.x += e.face*sp*0.5*dt;
        if (Math.abs(dx)<340 && Math.abs(dy)<80){ e.st='windup'; e.stT=0.55; }
      } else if (e.st==='windup'){
        if (e.stT<=0){ e.st='dash'; e.stT=0.5; e.dashF=Math.sign(dx)||e.face; }
      } else if (e.st==='dash'){
        e.x += e.dashF*sp*4.6*dt;
        if (e.stT<=0){ e.st='cool'; e.stT=0.9; }
      } else if (e.stT<=0) e.st='patrol';
      e.x = clamp(e.x, e.minX, e.maxX);

    } else if (e.behavior==='nest'){
      e.ct -= dt;
      if (e.ct<=0 && G.alive.length < 30){
        e.ct = 5.5;
        for (let k=0;k<2;k++) G.alive.push(spawnAt(e.spawns||'xyz', e.x+rnd(-16,16), e.y+rnd(-10,10)));
        boom(e.x, e.y, e.color, 6, 90);
      }

    } else if (e.behavior==='orbiter'){
      e.ang += 1.8*dt;
      e.orbR = Math.max(60, (e.orbR ?? 200) - 14*dt);
      const ox = G.px + Math.cos(e.ang)*e.orbR, oy = G.py + Math.sin(e.ang)*e.orbR*0.7;
      const aa = Math.atan2(oy-e.y, ox-e.x);
      e.x += Math.cos(aa)*sp*1.3*dt; e.y += Math.sin(aa)*sp*1.3*dt;
      e.y = clamp(e.y, 30, VH-GROUND_H-10);

    } else if (e.behavior==='boss'){
      bossStep(e, dt, dx, dy, sp);
    }

    if (!e.fly && e.behavior!=='nest'){ /* 走地怪贴地：y 固定在出生站台高度 */ }

    /* 触碰玩家：0.9s 无敌帧 */
    if (G.invulnT<=0 &&
        Math.abs(e.x-G.px) < (e.w+P.w)/2 && Math.abs(e.y-G.py) < (e.h+P.h)/2){
      G.hp -= e.dmg; G.levelHit = true; G.invulnT = P.invuln;
      G.vy = -260; G.vx = Math.sign(G.px-e.x)*200;
      boom(G.px, G.py, '#d16060', 10, 130);
      hud();
    }
  }

  /* ---- 敌弹 ---- */
  for (let i=G.eb.length-1;i>=0;i--){
    const b = G.eb[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life<=0 || b.y>VH || b.x<0 || b.x>L.width){ G.eb.splice(i,1); continue; }
    if (G.invulnT<=0 && Math.abs(b.x-G.px)<P.w/2+b.r && Math.abs(b.y-G.py)<P.h/2+b.r){
      G.hp -= b.dmg; G.levelHit = true; G.invulnT = P.invuln*0.7;
      G.eb.splice(i,1);
      boom(G.px, G.py, '#d16060', 8, 110);
      hud();
    }
  }

  /* ---- 粒子 ---- */
  for (let i=G.parts.length-1;i>=0;i--){
    const p = G.parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=dt;
    if (p.life<=0) G.parts.splice(i,1);
  }

  /* ---- 清版开门 / Boss ---- */
  if (!G.alive.length){
    if (L.boss && !G.bossDone){ spawnBoss(); }
    else if (!G.door.open){
      G.door.open = true;
      flash('出口开了 →', 2200);
    }
  }
  if (G.door.open && Math.abs(G.px-G.door.x)<40 && G.py > VH-GROUND_H-80){
    levelClear(); return;
  }

  if (G.hp <= 0){ G.hp = 0; hud(); died(); }
}

/* ---------------- Boss「引号」三幕 ---------------- */
function bossStep(e, dt, dx, dy, sp){
  /* 阶段推进 */
  if (e.phase===1 && e.hp < e.max*0.5){
    e.phase = 2;
    flash('两枚引号并成了一个环——它开始断章取义', 2600);
  }
  if (e.phase===2 && e.hp < e.max*0.25 && !e.shredded){
    e.phase = 3; e.shredded = true;
    G.weapon = makeStone(); G.quoted = false; G.bossQuote = null;
    flash('它撕碎了你的枪——写下最后一个词', 4200);
    try{ $('word').focus(); }catch{}
    hud();
  }

  /* 移动：悬浮 + P2 俯冲 */
  if (e.phase===2 && !e.shredded){
    e.stT -= dt;
    if (e.st==='windup'){
      if (e.stT<=0){ e.st='dash'; e.stT=0.55; e.dashA=Math.atan2(dy,dx); }
    } else if (e.st==='dash'){
      e.x += Math.cos(e.dashA)*sp*5*dt; e.y += Math.sin(e.dashA)*sp*5*dt;
      if (e.stT<=0){ e.st='hover'; e.stT=6; }
    } else {
      e.x += Math.sign(dx)*sp*0.5*dt;
      e.y += (200 + Math.sin(performance.now()/600)*60 - e.y)*0.8*dt;
      if (e.stT<=0){ e.st='windup'; e.stT=0.7; }
    }
  } else {
    e.x += Math.sign(dx)*sp*(e.shredded?0.35:0.5)*dt;
    e.y += (210 + Math.sin(performance.now()/600)*70 - e.y)*0.8*dt;
  }
  e.x = clamp(e.x, 60, LEVELS[G.level].width-60);
  e.y = clamp(e.y, 70, VH-GROUND_H-60);

  /* 原创窗口 */
  if (e.exposedT > 0){
    e.exposedT -= dt;
    if (e.exposedT <= 0){ e.armor = BOSS.armor; flash('护甲合拢了——它又开始等你重复自己'); }
  }

  /* 引用 */
  if (!e.shredded){
    e.quoteT -= dt;
    if (e.quoteT <= 0){
      e.quoteT = BOSS.quote.period;
      G.quoted = true;
      G.bossQuote = { count: Math.max(1, G.weapon.count), color: G.weapon.color };
      if (e.phase>=2 && G.weapon.effects.length){
        G.weapon.effects = [];
        flash('⚠ 断章取义——特效被撕掉了，重铸一个词', 3200);
      } else {
        flash('⚠ 它引用了你的枪（战力 -35%）——换个词，别让它拿住', 3200);
      }
      hud();
    }
  }

  /* 开火 */
  e.ct -= dt;
  if (e.ct<=0){
    const a = Math.atan2(dy, dx);
    if (e.shredded){
      e.ct = 3.0;
      for (let k=0;k<8;k++){
        const ba = k*(Math.PI/4);
        G.eb.push({ x:e.x, y:e.y, vx:Math.cos(ba)*105, vy:Math.sin(ba)*105, r:4, dmg:10, life:4 });
      }
    } else if (G.bossQuote){
      e.ct = e.phase>=2 ? 1.5 : 2.2;
      const q = G.bossQuote, spr = q.count>1 ? 0.24 : 0;
      for (let k=0;k<q.count;k++){
        const ba = a + (q.count>1 ? (k-(q.count-1)/2)*spr : 0);
        G.eb.push({ x:e.x, y:e.y, vx:Math.cos(ba)*205, vy:Math.sin(ba)*205, r:4, dmg:13, life:3.2, c:q.color });
      }
    } else {
      e.ct = e.phase>=2 ? 1.8 : 2.6;
      const n = e.phase>=2 ? 12 : 9, off = rnd(0, Math.PI*2);
      for (let k=0;k<n;k++){
        const ba = off + k*(Math.PI*2/n);
        G.eb.push({ x:e.x, y:e.y, vx:Math.cos(ba)*140, vy:Math.sin(ba)*140, r:4, dmg:11, life:3.6 });
      }
    }
  }

  /* 召唤「被引用的旧词」 */
  if (!e.shredded){
    e.sumT -= dt;
    if (e.sumT<=0 && G.alive.length < 26){
      e.sumT = e.phase>=2 ? 8 : 10;
      for (let k=0;k<2;k++) G.alive.push(spawnAt(BOSS.summon, e.x+rnd(-40,40), e.y+rnd(-20,20)));
    }
  }
}

/* ---------------- 开火 / 击杀 ---------------- */
function fire(){
  const w = G.weapon;
  const qMul = G.quoted ? BOSS.quote.factor : 1;
  const cnt = w.count, spread = cnt>1 ? 0.22 : 0;
  for (let i=0;i<cnt;i++){
    const a = (G.face>0 ? 0 : Math.PI) + (cnt>1 ? (i-(cnt-1)/2)*spread : 0) + rnd(-0.015,0.015);
    G.bullets.push({ x:G.px+G.face*14, y:G.py-4,
                     vx:Math.cos(a)*w.bulletSpeed, vy:Math.sin(a)*w.bulletSpeed,
                     dmg:w.damage*qMul, pierce:w.pierce, r:w.size, hit:[], life:1.6, gen:0 });
  }
  if (w.overload) G.hp -= 2.5;
}
function killEnemy(e, i){
  G.alive.splice(i,1);
  if (e.isBoss){
    G.boss = null; G.bossDone = true; G.quoted = false; G.bossQuote = null;
    boom(e.x, e.y, e.color, 46, 240);
    flash('引号松开了。', 2800);
    hud();
    return;
  }
  boom(e.x, e.y, '#7d8894', 8, 130);
  G.tok += CFG.token.kill;
  if (e.splits && !e.isChild){
    for (let k=0;k<2;k++){
      const c = spawnAt(e.mId, e.x+rnd(-12,12), e.y - 2);
      c.hp = c.max = e.max*0.3; c.w = e.w*0.6; c.h = e.h*0.6; c.sp = e.sp*1.8;
      c.dmg = e.dmg*0.6; c.isChild = true; c.splits = false;
      G.alive.push(c);
    }
  }
  hud();
}
function boom(x,y,color,n,sp){
  for (let i=0;i<n;i++){
    const a = rnd(0,Math.PI*2), v = rnd(sp*0.3, sp);
    G.parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:rnd(.25,.6), c:color });
  }
}

/* ---------------- 美术接入 ----------------
 * artReady 为假（或某帧缺图）时全部回退到 drawShape 几何占位——
 * 美术只替换显示层，碰撞盒、物理、数值一律不动。 */
let artReady = false;
if (window.WordForgeArt){
  WordForgeArt.load()
    .then(() => { artReady = true; })
    .catch(err => console.warn('美术资产加载失败，使用几何占位。', err));
}
function playerFrame(){
  if (G.invulnT > 0.35) return 'hurt';
  if (!G.onGround) return 'jump';
  if (Math.abs(G.vx) > 20) return 'run_' + (Math.floor(performance.now()/110) % 4);
  return 'idle_' + (Math.floor(performance.now()/420) % 2);
}
function enemyArtFrame(e){
  const tick = Math.floor((performance.now() + e.phase0*100) / 180) % 2;
  if (e.mId === 'tanhao')  return 'exclamation_' + tick;
  if (e.mId === 'paohua')  return 'bubble_' + tick;
  if (e.mId === 'gengshi') return 'meme_' + tick;
  return null;    // 其余怪物暂无图，走几何占位
}

/* ---------------- 渲染 ---------------- */
function drawShape(x, y, r, shape, color, face){
  ctx.fillStyle = color;
  ctx.beginPath();
  if (shape==='square'){ ctx.rect(x-r*0.9, y-r*0.9, r*1.8, r*1.8); }
  else if (shape==='tri'){
    const a0 = face<0 ? Math.PI : 0;
    for (let k=0;k<3;k++){
      const a=a0+k*2.094, px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
      k ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.closePath();
  } else if (shape==='diamond'){
    ctx.moveTo(x,y-r); ctx.lineTo(x+r*0.8,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r*0.8,y); ctx.closePath();
  } else if (shape==='ring'){
    ctx.arc(x,y,r,0,7); ctx.fill();
    ctx.fillStyle='#080b10'; ctx.beginPath(); ctx.arc(x,y,r*0.55,0,7);
  } else { ctx.arc(x,y,r,0,7); }
  ctx.fill();
}

function draw(){
  ctx.fillStyle = '#080b10'; ctx.fillRect(0,0,VW,VH);
  if (!G) return;
  const L = LEVELS[G.level], cam = G.cam;

  /* 远景网格（轻微视差） */
  ctx.strokeStyle = 'rgba(255,255,255,.03)'; ctx.lineWidth = 1;
  const off = -(cam*0.5)%48;
  for (let x=off; x<VW; x+=48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,VH); ctx.stroke(); }

  ctx.save();
  ctx.translate(-cam, 0);

  /* 地面与站台（美术优先，几何兜底；碰撞层不变，图只是显示） */
  const camL = Math.floor(cam/100)*100 - 100, camR = cam + VW + 100;
  if (!(artReady && WordForgeArt.drawTiled(ctx, 'level1', 'ground', camL, VH+4, camR-camL))){
    ctx.fillStyle = '#141a24';
    ctx.fillRect(0, VH-GROUND_H, L.width, GROUND_H);
    ctx.fillStyle = '#1c2432';
    ctx.fillRect(0, VH-GROUND_H, L.width, 3);
  }
  for (const p of platsOf()){
    if (artReady && WordForgeArt.drawTiled(ctx, 'level1', 'platform', p[0], p[1]+22, p[2])) continue;
    ctx.fillStyle = '#182030'; ctx.fillRect(p[0], p[1], p[2], 9);
    ctx.fillStyle = '#243349'; ctx.fillRect(p[0], p[1], p[2], 2.5);
  }

  /* 出口门（开/关两态） */
  const d = G.door;
  if (!(artReady && WordForgeArt.draw(ctx, 'level1', d.open?'door_open':'door_closed', d.x, VH-GROUND_H+6))){
    ctx.fillStyle = d.open ? '#5fb08a' : '#26303d';
    ctx.fillRect(d.x-16, VH-GROUND_H-56, 32, 56);
    ctx.fillStyle = '#080b10';
    ctx.fillRect(d.x-10, VH-GROUND_H-48, 20, 48);
    if (d.open){
      ctx.fillStyle = 'rgba(95,176,138,.25)';
      ctx.fillRect(d.x-10, VH-GROUND_H-48, 20, 48);
    }
  }

  /* 粒子 */
  for (const p of G.parts){
    ctx.globalAlpha = Math.max(0, p.life*2);
    ctx.fillStyle = p.c; ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  /* 敌人（有图用图，没图回退几何——后续关卡的怪继续用占位形状） */
  for (const e of G.alive){
    const af = enemyArtFrame(e);
    const drawn = af && artReady &&
      WordForgeArt.draw(ctx, 'level1', af, e.x, e.y + e.h/2 + 2, e.face > 0);
    if (!drawn) drawShape(e.x, e.y, Math.max(e.w,e.h)/2, e.shape, e.color, e.face);
    if (e.st==='windup'){
      ctx.strokeStyle='#e07070'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(e.w,e.h)/2+5, 0, 7); ctx.stroke();
    }
    if (e.slow>0){
      ctx.strokeStyle='#7db8d9'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(e.w,e.h)/2+2, 0, 7); ctx.stroke();
    }
    if (e.armor && !e.isBoss){                     // 杠头正面免伤标识：面朝侧一条亮边
      ctx.fillStyle = '#9aa7b8';
      ctx.fillRect(e.x + e.face*(e.w/2-2) - 1.5, e.y-e.h/2, 3, e.h);
    }
    if (e.hp < e.max && !e.isBoss){
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-8, e.w, 3);
      ctx.fillStyle='#d16060'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-8, e.w*(e.hp/e.max), 3);
    }
    if (e.isBoss && e.exposedT>0){                 // 原创窗口：绿色缺口环
      ctx.strokeStyle='#5fb08a'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.w/2+10, 0, Math.PI*1.5); ctx.stroke();
    }
  }

  /* 敌弹 */
  for (const b of G.eb){
    ctx.fillStyle = b.c || '#c86060';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
  }

  /* 玩家子弹 */
  ctx.fillStyle = G.weapon.color; ctx.shadowColor = G.weapon.color; ctx.shadowBlur = 7;
  for (const b of G.bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); }
  ctx.shadowBlur = 0;

  /* 玩家「白描」：精灵图优先，几何兜底；受击闪烁两版通用 */
  const P = CFG.player;
  if (!(G.invulnT>0 && Math.floor(performance.now()/90)%2)){
    // 武器色的脚下墨晕：替代原来的方框描边，不遮精灵
    const grd = ctx.createRadialGradient(G.px, G.py+P.h/2, 2, G.px, G.py+P.h/2, 18);
    grd.addColorStop(0, G.weapon.color + '55'); grd.addColorStop(1, G.weapon.color + '00');
    ctx.fillStyle = grd;
    ctx.fillRect(G.px-20, G.py+P.h/2-8, 40, 12);

    const drawn = artReady &&
      WordForgeArt.draw(ctx, 'player', playerFrame(), G.px, G.py + P.h/2 + 2, G.face < 0);
    if (!drawn){
      ctx.fillStyle = G.weapon.overload ? '#e07070' : '#f2efe6';
      ctx.fillRect(G.px-P.w/2, G.py-P.h/2, P.w, P.h);
      ctx.strokeStyle = G.weapon.color; ctx.lineWidth = 2;
      ctx.strokeRect(G.px-P.w/2-3, G.py-P.h/2-3, P.w+6, P.h+6);
      ctx.fillStyle = '#39485A';
      ctx.fillRect(G.px + G.face*(P.w/2-2) - 1.5, G.py-6, 3, 12);
    } else if (G.weapon.overload){
      ctx.fillStyle = 'rgba(224,112,112,.28)';     // 过载状态在精灵上加红罩提示
      ctx.fillRect(G.px-P.w/2-4, G.py-P.h/2-4, P.w+8, P.h+8);
    }
  }

  ctx.restore();

  /* Boss 血条（屏幕空间） */
  if (G.boss){
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(14, 10, VW-28, 7);
    ctx.fillStyle=BOSS.color; ctx.fillRect(14, 10, (VW-28)*(G.boss.hp/G.boss.max), 7);
  }
}

/* ---------------- 锻造 ---------------- */
function costOf(word){
  const w = word.trim();
  const n = [...w].length;
  if (!n) return CFG.forge.base;
  const c = CFG.forge.base + CFG.forge.perChar*n;
  return G && G.cache[w] ? Math.round(c*CFG.forge.cacheDiscount) : c;
}
async function forge(){
  if (!G || G.phase==='dead' || G.phase==='win') return;
  const word = $('word').value.trim();
  if (!word) return;
  const cost = costOf(word);
  if (cost > G.tok){ flash('token 不够'); return; }

  running = false;
  $('btnMake').disabled = true; $('btnMake').textContent = '锻造中';

  let judged, meta = { source:mode };
  if (mode === 'llm'){
    const r = await llmJudge(word);
    if (r.v){ judged = r.v; meta.ms = r.ms; G.realTokens += r.usage?.total_tokens || 0; }
    else { judged = ruleJudge(word); judged.reason = '一字师被噪音盖住了耳朵——翻《旧典》按字面硬铸'; meta.source='fallback'; }
  } else {
    judged = ruleJudge(word);
  }

  const wasCached = !!G.cache[word];
  G.tok -= cost;
  G.cache[word] = true;
  G.quoted = false; G.bossQuote = null;
  let exposed = false;
  if (G.boss && !G.boss.shredded && !wasCached){
    G.boss.exposedT = BOSS.exposeSec;
    G.boss.armor = 0;
    exposed = true;
  }

  const wpn = buildWeapon(word, judged, cost);
  G.weapon = wpn;
  G.forged.push({ word, power:wpn.power, cost, arch:wpn.archLabel,
                  effects:wpn.effects.map(e=>FX[e].label), overload:wpn.overload, src:meta.source });

  $('word').value = '';
  $('btnMake').disabled = false; $('btnMake').textContent = '锻造';
  hud(); renderTips(); updCost();
  const fxs = wpn.effects.map(e=>FX[e].label).join('/');
  flash(`${wpn.name} · ${wpn.archLabel}型 · 战力 ${wpn.power}${fxs?' · '+fxs:''}`
        + (wpn.dropped?` · 特效超过 ${MAX_FX} 个，裁掉 ${wpn.dropped}`:'')
        + (wpn.overload?' · 过载！每发自伤':'')
        + (exposed?` · 原创！引号哑火 ${BOSS.exposeSec} 秒`:''), exposed?3400:2600);
  $('word').blur();
  if (G.phase==='fight'){ running = true; lastT = performance.now(); }
}

/* ---------------- HUD / 提示 ---------------- */
function hud(){
  if (!G) return;
  $('hHp').textContent = Math.max(0, Math.round(G.hp));
  $('hTok').textContent = Math.round(G.tok);
  $('hLv').textContent = (G.level+1) + '/' + LEVELS.length;
  $('hEn').textContent = G.alive.length;
  const w = G.weapon;
  const el = $('hWpn');
  el.textContent = (G.quoted ? '〔被引用〕' : '')
    + `${w.name} 战力${w.power}${w.effects.length?' · '+w.effects.map(e=>FX[e].label).join('/'):''}`;
  el.style.color = G.quoted ? '#e07070' : w.color;
}
function updCost(){
  const v = $('word').value.trim();
  const c = costOf(v);
  const el = $('cost');
  el.textContent = (G && G.cache[v] ? '½ ' : '') + c;
  el.className = 'cost' + (G && c > G.tok ? ' no' : '');
  $('btnMake').disabled = !v || !G || c > G.tok || G.phase==='dead' || G.phase==='win';
}
let flashT = null;
function flash(msg, ms=1500){
  const f = $('flash'); f.textContent = msg; f.classList.add('on');
  clearTimeout(flashT); flashT = setTimeout(()=>f.classList.remove('on'), ms);
}
function renderTips(){
  const box = $('tips'); box.innerHTML = '';
  if (!G) return;
  const cached = Object.keys(G.cache);
  const sug = cached.length ? cached.slice(-4) : ['冰锥','散弹','黑洞','会追踪的火焰弹'];
  const l = document.createElement('span');
  l.textContent = cached.length ? '造过的（半价）：' : '试试：';
  box.appendChild(l);
  sug.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s;
    if (G.cache[s]) b.className = 'cached';
    b.onclick = () => { $('word').value = s; updCost(); $('word').focus(); };
    box.appendChild(b);
  });
}

/* ---------------- 模式 ---------------- */
function setMode(m){
  mode = m;
  const b = $('hMode');
  b.textContent = m==='llm' ? '一字师 · 模型' : '旧典 · 词表';
  b.className = 'mode' + (m==='llm' ? ' llm' : '');
}
function openCfg(){
  running = false;
  showScreen(`
    <div class="sheet">
      <h2 style="font-size:16px;margin:0 0 4px">谁来听你说话？</h2>
      <p style="font-size:12px;margin:0 0 6px;color:var(--dim)">
        <b style="color:var(--ink)">《旧典》</b>（词表）：一本老词典，只认字面。词表外的词它靠字形瞎猜。<br/>
        <b style="color:var(--good)">一字师</b>（模型）：最后一个认真听人说话的东西。能理解任何词，包括「胶水」「WiFi」「我前女友的脾气」。
      </p>
      <label>Base URL</label><input id="cU" placeholder="https://api.deepseek.com/v1"/>
      <div class="presets">
        <button data-u="https://api.deepseek.com/v1" data-m="deepseek-chat">DeepSeek</button>
        <button data-u="https://dashscope.aliyuncs.com/compatible-mode/v1" data-m="qwen-plus">通义</button>
        <button data-u="https://open.bigmodel.cn/api/paas/v4" data-m="glm-4-flash">GLM</button>
        <button data-u="https://api.moonshot.cn/v1" data-m="moonshot-v1-8k">Kimi</button>
      </div>
      <label>API Key</label><input id="cK" type="password" placeholder="sk-..."/>
      <label>Model</label><input id="cM" placeholder="deepseek-chat"/>
      <div class="meta" style="margin-top:8px">兼容任意 OpenAI 协议接口（/chat/completions）。Key 只存本机浏览器，不进代码。<br/>没有 Key？智谱 GLM 的 glm-4-flash 有免费额度，注册即用。</div>
      <button class="big" id="cS">请一字师来听（模型判定）</button>
      <button class="ghost" id="cR" style="width:100%;margin-top:8px">翻《旧典》就行（无需 Key）</button>
    </div>`);
  $('cU').value = cfgLLM.url || 'https://api.deepseek.com/v1';
  $('cM').value = cfgLLM.model || 'deepseek-chat';
  $('cK').value = cfgLLM.key || '';
  document.querySelectorAll('.presets button').forEach(b=>{
    b.onclick = () => { $('cU').value=b.dataset.u; $('cM').value=b.dataset.m; };
  });
  $('cS').onclick = () => {
    cfgLLM = { url:$('cU').value.trim(), key:$('cK').value.trim(), model:$('cM').value.trim() };
    if (!cfgLLM.url||!cfgLLM.key||!cfgLLM.model){ alert('三项都要填，或者直接用《旧典》。'); return; }
    store.set('wf_cfg', JSON.stringify(cfgLLM));
    setMode('llm'); startRun(G ? G.level : 0);
  };
  $('cR').onclick = () => { setMode('rule'); startRun(G ? G.level : 0); };
}

/* ---------------- 开始画面 ---------------- */
function showStart(){
  const un = Math.min(+(store.get('wf_unlock')||0), LEVELS.length-1);
  const lvBtns = LEVELS.map((L,i) =>
    `<button class="ghost" data-l="${i}" ${i<=un?'':'disabled style="opacity:.3"'}>${i+1}</button>`).join('');
  showScreen(`
    <h2>词 造 武 器</h2>
    <div class="meta">—— 白 噪 纪 ——</div>
    <p>语言病了。复读、谣言、空话吃光了词的意思，<br/>语义层沦为白噪之海。<br/><br/>
       你是校对员<span class="k">白描</span>——还能把活着的词铸成枪的人。<br/>
       打字输入<span class="k">任意一个词</span>，交给一字师，它就是你的武器。<br/>
       短词是赌，长句是稳；写明的特效必然实装。</p>
    <div class="keys"><b>←→/AD</b> 移动 <b>↑/W/空格</b> 二段跳 <b>Enter</b> 锻造（打字时暂停）</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center">
      <button class="big" id="btnStart">开 始（无需 Key）</button>
      <button class="ghost" id="btnAI" style="border-color:var(--good);color:var(--good)">⚡ 接入 AI 判定（一字师）</button>
    </div>
    <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center">
      <span class="meta">选关</span>${lvBtns}
    </div>
    <div class="meta">默认用《旧典》词表判定，只认字面；接入模型后它能听懂任何词——两种都通一遍，差别就是本作要说明的事。</div>`);
  $('btnStart').onclick = () => startRun(0);
  $('btnAI').onclick = openCfg;
  document.querySelectorAll('#screen [data-l]').forEach(b => b.onclick = () => startRun(+b.dataset.l));
}

/* ---------------- 输入 ---------------- */
addEventListener('keydown', e => {
  if (e.target === $('word')){
    if (e.key === 'Escape') $('word').blur();
    return;
  }
  keys[e.code] = true;
  if ((e.code==='ArrowUp' || e.code==='KeyW' || e.code==='Space') && G && G.phase==='fight' && running){
    if (G.jumpsLeft > 0){ G.vy = -CFG.player.jumpV; G.jumpsLeft--; G.onGround=false; }
    e.preventDefault();
  }
  if (e.key==='Enter'){ $('word').focus(); e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.target !== $('word')) keys[e.code] = false; });

$('word').addEventListener('focus', () => { if (G && G.phase==='fight') running = false; });
$('word').addEventListener('blur',  () => {
  if (G && G.phase==='fight' && !G.over){ running = true; lastT = performance.now(); }
});
$('word').addEventListener('input', updCost);
$('word').addEventListener('keydown', e => {
  if (e.key==='Enter'){ e.preventDefault(); forge(); }
});
$('btnMake').onclick = forge;
$('hMode').onclick = openCfg;

/* ---------------- 启动 ---------------- */
(function boot(){
  try{ const c = JSON.parse(store.get('wf_cfg')||'null'); if (c) cfgLLM = c; }catch{}
  setMode('rule');
  resize();
  showStart();
})();
</script>
</body>
